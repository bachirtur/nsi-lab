<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSI LAB — Plateforme pédagogique NSI</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- CodeMirror 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <!-- Marked.js for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- sql.js for SQL engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>
  <!-- HEADER -->
  <header class="app-header">
    <a href="#" class="brand" onclick="app.navigate('home'); return false;">
      <span class="brand-icon">🧠</span>
      <span>NSI LAB</span>
    </a>
    <nav class="nav-main">
      <a href="#" onclick="app.navigate('home'); return false;" data-nav="home">Accueil</a>
      <a href="#" onclick="app.navigate('courses'); return false;" data-nav="courses">Cours</a>
      <a href="#" onclick="app.navigate('exercises'); return false;" data-nav="exercises">Exercices</a>
      <a href="#" onclick="app.navigate('series'); return false;" data-nav="series">Séries</a>
      <a href="#" onclick="app.navigate('projects'); return false;" data-nav="projects">Projets</a>
      <a href="#" onclick="app.navigate('revision'); return false;" data-nav="revision">Révisions</a>
      <a href="#" onclick="app.navigate('progress'); return false;" data-nav="progress">Progression</a>
    </nav>
    <div class="header-actions">
      <div class="search-box">
        <input type="text" id="globalSearch" placeholder="Rechercher..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
      <button class="btn-icon" id="themeToggle" title="Mode sombre/clair">☀️</button>
      <button class="btn-icon" title="Profil">👤</button>
      <button class="btn-icon" id="menuToggle" title="Menu" style="display:none;">☰</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="app-sidebar" id="sidebar">
    <div id="sidebarContent">
      <!-- Généré dynamiquement -->
    </div>
  </aside>

  <!-- MAIN -->
  <main class="app-main" id="mainContent">
    <!-- Contenu dynamique -->
  </main>

  <!-- OVERLAY MOBILE -->
  <div id="mobileOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:950;" onclick="app.toggleSidebar()"></div>

  <!-- SCRIPTS -->
  <script src="js/app.js"></script>
  <script src="js/engines/python-engine.js"></script>
  <script src="js/engines/sql-engine.js"></script>
</body>
</html>
